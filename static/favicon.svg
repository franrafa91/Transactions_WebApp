<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <!-- Shared Drop Shadow Filter for Rings & Text -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Container/Hosting Circle -->
  <circle cx="150" cy="150" r="148" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Inner Ring Plot Background Track (Radius = 80) -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#e2e8f0" stroke-width="24" />

  <!-- Segment 1: Blue (40% = 201.06) -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#3b82f6" stroke-width="24"
          stroke-dasharray="628" stroke-dashoffset="0"
          transform="rotate(-30 150 150)" filter="url(#elementShadow)" />

  <!-- Segment 2: Green (35% = 175.93) -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#10b981" stroke-width="24"
          stroke-dasharray="754" stroke-dashoffset="377"
          transform="rotate(-30 150 150)" filter="url(#elementShadow)" />

  <!-- Segment 3: Orange -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#f59e0b" stroke-width="24"
          stroke-dasharray="754" stroke-dashoffset="560"
          transform="rotate(-30 150 150)" filter="url(#elementShadow)" />

  <!-- Segment 4: Red-Orange -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#f54e0b" stroke-width="24"
          stroke-dasharray="754" stroke-dashoffset="660"
          transform="rotate(-30 150 150)" filter="url(#elementShadow)" />
  
  <!-- Center Core Circle -->
  <circle cx="150" cy="150" r="90" fill="#ffffff" filter="url(#elementShadow)" />

  <!-- Centered Golden Euro Sign -->
  <text x="140" y="208" 
        text-anchor="middle" 
        font-family="sans-serif" 
        font-weight="bold" 
        font-size="170px" 
        fill="url(#goldGradient)"
        filter="url(#elementShadow)">€</text>
</svg>
